name: Horizon Multi-Profile Daily Summary

on:
  workflow_dispatch:      # Allow manual trigger

env:
  TZ: Asia/Shanghai

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Run Horizon Multi-Profile Pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HORIZON_AI_BASE_URL: ${{ secrets.HORIZON_AI_BASE_URL }}
          HORIZON_NTFY_TOPIC: ${{ secrets.HORIZON_NTFY_TOPIC }}
          HORIZON_NTFY_TOPIC_PM: ${{ secrets.HORIZON_NTFY_TOPIC_PM }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon

      - name: Set up Ruby for Jekyll build
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # --- Profile 1: Tech & News (cesszlr-horizon) ---
      - name: Deploy Tech Summary to GitHub Pages Branch (gh-pages)
        if: hashFiles('docs/github/**') != '' || hashFiles('docs/**') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/github
          keep_files: true
          commit_message: "📝 Tech Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Build Tech Jekyll site
        if: hashFiles('docs/github/**') != ''
        run: |
          mkdir -p dist-html-github
          cd docs/github
          echo 'source "https://rubygems.org"' > Gemfile
          echo 'gem "jekyll", "~> 4.3"' >> Gemfile
          echo 'gem "jekyll-theme-cayman"' >> Gemfile
          echo 'gem "jekyll-feed"' >> Gemfile
          bundle install
          bundle exec jekyll build --baseurl "" --destination ../../dist-html-github

      - name: Deploy Tech site to Cloudflare Pages (cesszlr-horizon)
        if: hashFiles('dist-html-github/**') != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-html-github --project-name=cesszlr-horizon

      # --- Profile 2: PM & Trending (bao-horizon) ---
      - name: Deploy PM Summary to GitHub Pages Branch (gh-pages-pm)
        if: hashFiles('docs/pm/**') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/pm
          keep_files: true
          commit_message: "📝 PM Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages-pm
          enable_jekyll: true

      - name: Build PM Jekyll site
        if: hashFiles('docs/pm/**') != ''
        run: |
          mkdir -p dist-html-pm
          cd docs/pm
          echo 'source "https://rubygems.org"' > Gemfile
          echo 'gem "jekyll", "~> 4.3"' >> Gemfile
          echo 'gem "jekyll-theme-cayman"' >> Gemfile
          echo 'gem "jekyll-feed"' >> Gemfile
          bundle install
          bundle exec jekyll build --baseurl "" --destination ../../dist-html-pm

      - name: Deploy PM site to Cloudflare Pages (bao-horizon)
        if: hashFiles('dist-html-pm/**') != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-html-pm --project-name=bao-horizon